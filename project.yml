name: WDAProxy
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  WDAProxy:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: WDAProxy
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        MinimumOSVersion: "15.0"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 本地网络权限：允许监听 0.0.0.0 并接受局域网连接
        NSLocalNetworkUsageDescription: 需要访问本地网络，把手机上的 WebDriverAgent 端口转发到同网段的电脑。
        # 后台保活：location 比 audio 稳，audio 作为双保险
        NSLocationWhenInUseUsageDescription: 用于在后台保持端口转发服务持续运行。
        NSLocationAlwaysAndWhenInUseUsageDescription: 用于在后台保持端口转发服务持续运行。
        NSLocationAlwaysUsageDescription: 用于在后台保持端口转发服务持续运行。
        UIBackgroundModes:
          - audio
          - location
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.wdaproxy
        PRODUCT_NAME: WDAProxy
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_BITCODE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
